<button
  type="button"
  class="menu-button"
  [attr.aria-label]="menuOpen ? 'Close menu' : 'Open menu'"
  [attr.aria-expanded]="menuOpen"
  (click)="toggleMenu()"
>
  <span aria-hidden="true">&#9776;</span>
</button>

@if (menuOpen) {
  <button type="button" class="menu-backdrop" aria-label="Close menu" (click)="closeMenu()"></button>
}

<aside class="side-menu" [class.open]="menuOpen" aria-label="Main menu">
  <div class="side-menu-header">
    <strong>Menu</strong>
    <button type="button" class="secondary" (click)="closeMenu()">Close</button>
  </div>
  <nav class="side-menu-actions">
    @if (hasEvent) {
      <button type="button" class="menu-action" [class.active]="showingFavoritePools" (click)="selectFavorites()">
        <span>Favorites</span>
        <small>{{ favoritePoolCount }}</small>
      </button>
      <button type="button" class="menu-action" (click)="selectChooseEvent()">Choose event</button>
    }
    @if (isAdmin) {
      <button type="button" class="menu-action" (click)="selectAdminSignOut()">Sign Out</button>
    } @else {
      <button type="button" class="menu-action" (click)="selectAdmin()">Admin</button>
    }
  </nav>
  @if (hasEvent && poolCount > 0) {
    <div class="side-menu-divider"></div>
    <div class="division-dropdown">
      <button
        type="button"
        class="division-item"
        [class.active]="!showingFavoritePools && !selectedCategory && !selectedDivision"
        (click)="selectPools()"
      >
        <span>Event Overview</span>
        <small>{{ poolCount }}</small>
      </button>
      @for (category of divisionOptions; track category.category) {
        <button
          type="button"
          class="division-item"
          [class.active]="selectedCategory === category.category && !selectedDivision"
          (click)="selectDivision(category.category, null)"
        >
          <span>{{ category.category }}</span>
          <small>{{ category.cards.length }}</small>
        </button>
        @for (option of category.divisions; track option.category + option.division) {
          <button
            type="button"
            class="division-item division-child"
            [class.active]="selectedCategory === category.category && selectedDivision === option.division"
            (click)="selectDivision(category.category, option.division)"
          >
            <span>{{ option.division }}</span>
            <small>{{ option.count }}</small>
          </button>
        }
      }
    </div>
  }
</aside>
